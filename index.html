<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Gym Log</title>

<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M8 12h8M2 12h2m16 0h2"/><rect x="4" y="6" width="4" height="12" rx="1"/><rect x="16" y="6" width="4" height="12" rx="1"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h2m4 0h2"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 3v17h18M7 15l5-5 4 3 5-6"/></symbol>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7z"/></symbol>

    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 5v6h6m-6 0 3-3a8 8 0 1 1 2 12"/></symbol>
  </svg>
  <header class="site-header">
    <div class="site-bar">
      <a class="brand" href="#/"><span class="brand-mark"><svg aria-hidden="true"><use href="#i-dumbbell"/></svg></span>Gym Log</a>
    </div>
  </header>
  <main id="main"></main>
  <nav aria-label="Điều hướng chính">
    <a href="#/" data-r=""><span><svg aria-hidden="true"><use href="#i-home"/></svg></span>Hôm nay</a>
    <a href="#/workout" data-r="workout"><span><svg aria-hidden="true"><use href="#i-dumbbell"/></svg></span>Tập</a>
    <a href="#/history" data-r="history"><span><svg aria-hidden="true"><use href="#i-calendar"/></svg></span>Lịch sử</a>
    <a href="#/progress" data-r="progress"><span><svg aria-hidden="true"><use href="#i-trend"/></svg></span>Tiến độ</a>
    <a href="#/settings" data-r="settings"><span><svg aria-hidden="true"><use href="#i-settings"/></svg></span>Cài đặt</a>
