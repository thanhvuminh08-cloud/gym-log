<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Luyện Thể">
  <title>Luyện Thể Ký</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M8 12h8M2 12h2m16 0h2"/><rect x="4" y="6" width="4" height="12" rx="1"/><rect x="16" y="6" width="4" height="12" rx="1"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h2m4 0h2"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 3v17h18M7 15l5-5 4 3 5-6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h4m4 0h8M4 17h8m4 0h4"/><circle cx="10" cy="7" r="2"/><circle cx="14" cy="17" r="2"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7z"/></symbol>
    <symbol id="i-backup" viewBox="0 0 24 24"><path d="M12 3v11m-4-4 4 4 4-4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 5v6h6m-6 0 3-3a8 8 0 1 1 2 12"/></symbol>
    <symbol id="i-medal" viewBox="0 0 24 24"><circle cx="12" cy="15" r="6"/><path d="m6 3 3 7m9-7-3 7m-9-7h12m-8 12 1.4 1.4L14 14"/></symbol>
  </svg>
  <header class="site-header">
    <div class="site-bar">
      <a class="brand" href="#/"><span class="brand-mark"><svg aria-hidden="true"><use href="#i-dumbbell"/></svg></span>Luyện Thể Ký</a>
    </div>
  </header>
  <main id="main"></main>
  <template id="loading-home">
    <div class="loading-view" role="status">
      <span class="loading-label">Đang tải Động phủ</span>
      <div class="loading-line" aria-hidden="true"></div>
      <div class="loading-block loading-hero" aria-hidden="true"></div>
      <div class="loading-grid" aria-hidden="true"><div class="loading-block"></div><div class="loading-block"></div></div>
    </div>
  </template>
  <template id="loading-tang-thu">
    <div class="loading-view" role="status">
      <span class="loading-label">Đang tải Tàng thư</span>
      <div class="loading-line" aria-hidden="true"></div>
      <div class="loading-grid loading-tabs" aria-hidden="true">
        <div class="loading-block"></div><div class="loading-block"></div><div class="loading-block"></div><div class="loading-block"></div>
      </div>
      <div class="loading-block loading-hero" aria-hidden="true"></div>
    </div>
  </template>
  <nav class="site-nav" aria-label="Điều hướng chính"></nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
