<!doctype html>
<!-- Smoke test: mở http://localhost:8080/smoke.html, đọc dòng cuối "SMOKE: PASS/FAIL".
     Chạy app trong iframe với DB riêng (gym-smoke), không đụng dữ liệu thật. Không cần chụp màn hình. -->
<html lang="vi"><head><meta charset="utf-8"><title>Smoke</title>
<style>body{font:14px monospace;background:#111;color:#ddd;margin:12px}iframe{width:375px;height:700px;border:1px solid #444;float:right}.f{color:#f66}.p{color:#6f6}</style>
</head><body>
<iframe id="f"></iframe><pre id="out"></pre>
<script type="module">
const DB = 'gym-smoke', out = document.getElementById('out'), frame = document.getElementById('f');
const lines = []; let fail = 0;
const log = (ok, msg) => { if (!ok) fail++; lines.push(`${ok ? 'PASS' : 'FAIL'} ${msg}`); out.textContent = lines.join('\n'); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 3000) => { for (let t = 0; t < ms; t += 50) { const v = fn(); if (v) return v; await wait(50); } return null; };

await new Promise((r) => { const q = indexedDB.deleteDatabase(DB); q.onsuccess = q.onerror = q.onblocked = r; });
localStorage.removeItem('gym.restEnd'); localStorage.removeItem('gym.restStart');
const seenBak = localStorage.getItem('gym.medalSeen'); localStorage.removeItem('gym.medalSeen');
const setBak = localStorage.getItem('gym.settings'); localStorage.removeItem('gym.settings');
sessionStorage.removeItem('gym.daoDraft'); // bản nháp Nhập môn dở (iframe dùng chung sessionStorage với tab)
frame.src = `index.html?db=${DB}#/`;
await new Promise((r) => (frame.onload = r));
const w = frame.contentWindow, $ = (s) => w.document.querySelector(s), $$ = (s) => [...w.document.querySelectorAll(s)];
w.confirm = () => true; w.prompt = () => 'Smoke A';
const errors = []; w.addEventListener('error', (e) => errors.push(e.message)); w.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
const go = async (hash) => { w.location.hash = hash; await wait(300); };
const input = (el, v) => { el.value = v; el.dispatchEvent(new w.Event('input', { bubbles: true })); };
const fillSets = (vals) => $$('.set:not(.head)').forEach((r, i) => { const [a, b] = r.querySelectorAll('input'); input(a, vals[i] ?? vals.at(-1)); input(b, 8); });
const check = async (i) => { $$('.set:not(.head) .check')[i].click(); await wait(150); };
const step = async (name, fn) => { try { const r = await fn(); log(r !== false, name); } catch (e) { log(false, `${name} — ${e.message}`); } };

try {
  await step('Lần đầu mở app: ở Động phủ, thẻ "Ghi buổi tập đầu tiên" + mời Nhập môn; "Để sau" ẩn lời mời', async () => {
    const first = await until(() => $('[data-first-run]') && $('.dao-invite[href="#/nhap-mon"]'));
    if (!first) throw new Error(`không có thẻ lần đầu (${w.location.hash})`);
    const stay = w.location.hash === '#/' || w.location.hash === '';
    await go('#/nhap-mon/6'); // nhảy cóc khi chưa khai thân thể → về bước 2
    const back2 = !!(await until(() => $('[data-dao-step="2"]')));
    // "Để sau" chỉ có ở bước 6; giả lập bằng cờ như nút làm, rồi mở lại Động phủ.
    const s = JSON.parse(w.localStorage.getItem('gym.settings') || '{}'); w.localStorage.setItem('gym.settings', JSON.stringify({ ...s, daoSkip: Date.now() }));
    await go('#/'); await until(() => $('[data-first-run]'));
    return stay && back2 && w.location.hash === '#/' && !$('.dao-invite');
  });
  await step('Bế quan khi chưa có buổi: không bật về, chỉ hiện buổi trống, bấm thì vào buổi', async () => {
    await go('#/workout');
    const page = await until(() => $('.workout-start [data-act=empty]'));
    const only = !!page && w.location.hash === '#/workout' && $$('.workout-start button').length === 1;
    page.click();
    const opened = !!(await until(() => $('[data-act=addEx]')));
    $('[data-act=discard]').click(); await until(() => w.location.hash === '#/' && $('[data-schedule-today]'));
    return only && opened;
  });
  await step('Trang Hôm nay hiện nút bắt đầu', async () => !!(await until(() => $('[data-act=empty]'))));
  await step('Bắt đầu buổi tập trống', async () => { $('[data-act=empty]').click(); return !!(await until(() => w.location.hash === '#/workout' && $('[data-act=addEx]'))); });
  await step('Động phủ: tiếp tục buổi dở từ thẻ lịch hôm nay', async () => {
    await go('#/'); const resume = await until(() => $('[data-schedule-today] a[href="#/workout"]'));
    if (!resume || $('[data-act=empty]')) return false;
    resume.click(); return !!(await until(() => w.location.hash === '#/workout' && $('[data-act=addEx]')));
  });
  await step('Chọn bài tập từ picker', async () => {
    $('[data-act=addEx]').click(); const s = await until(() => $('.modal input'));
    input(s, 'bench'); (await until(() => $('.pick-list .item'))).click();
    return !!(await until(() => $$('.set:not(.head)').length >= 3));
  });
  await step('Ghi set + đồng hồ nghỉ chạy', async () => { fillSets([60, 65]); await check(0); await check(1); return $$('.set.done').length === 2 && !!$('.rest-bar.show'); });
  await step('Set thường vừa lưu: .is-set-sealed (gỡ sau ~480 ms) + âm setXong; tên buổi không lặp ngày', async () => {
    const sealed = !!$('.set.is-set-sealed'); await wait(500);
    const { played } = await w.eval(`import('./js/sfx.js')`);
    return sealed && !$('.set.is-set-sealed') && played.filter((n) => n === 'setXong').length === 2 && $('[data-f=name]').value === 'Buổi tập tự do';
  });
  await step('Vòng nghỉ: --rest-progress, ±15, mở lại app, cảnh báo ≤10s', async () => {
    const t = await w.eval("import('./js/timer.js')"), ls = w.localStorage, bar = $('.rest-bar');
    const P = () => Number(bar.style.getPropertyValue('--rest-progress')), warn = () => bar.dataset.warn ?? '-';
    t.start(60); const a = [P(), warn()];
    bar.querySelector('[data-d="15"]').click(); const b = [P(), warn()];
    const now = Date.now(); ls.setItem('gym.restStart', now - 52000); ls.setItem('gym.restEnd', now + 8000); t.resume(); // mở lại app, còn 8s / 60s
    const c = [Math.round(P()), warn()];
    ls.setItem('gym.restEnd', now + 30000); t.resume(); const d = warn();
    t.stop(); const e = [warn(), ls.getItem('gym.restStart')];
    const got = [...a, ...b, ...c, d, ...e, t.restProgress(0, 100, 25), t.restProgress(0, 100, 200), t.restProgress(5, 5, 0)].join(',');
    const want = [100, '-', 100, '-', 13, 'true', '-', '-', null, 75, 0, 0].join(',');
    if (got !== want) lines.push(`  ${got} ≠ ${want}`);
    return got === want;
  });
  await step('Kết thúc → trang chi tiết', async () => { $('[data-act=finish]').click(); return !!(await until(() => w.location.hash.startsWith('#/ky/'))); });
  await step('Tổng kết (O2): Thu hoạch có +Linh khí, mạch, Buổi sau; thiếu cân nặng → hỏi ngay tại đây (O1)', async () => {
    const rc = await until(() => $('[data-recap]'));
    const ok = !!rc && /\+\d+/.test($('[data-recap-linhkhi]')?.textContent || '') && !!$('[data-recap-meridian=chest]')
      && !!$('[data-recap] [data-hero-profile] [name=weight]') && !!$('[data-recap-next=meridian]');
    if (!ok) lines.push(`  ${rc?.textContent.replace(/\s+/g, ' ')}`);
    return ok;
  });
  await step('Lưu thành giáo án', async () => { (await until(() => $('[data-act=tpl]'))).click(); await wait(200); await go('#/templates'); return w.document.body.innerText.includes('Smoke A'); });
  await step('Tập lại từ giáo án, hiện số liệu lần trước', async () => {
    await go('#/cong-phap'); (await until(() => $('button[data-id]'))).click();
    await until(() => $$('.set:not(.head)').length);
    return $$('.set:not(.head) .prev')[0]?.textContent.includes('60');
  });
  await step('Hiện mục tiêu quá tải từ lần trước', () => !!$('.target')?.textContent.includes('65kg × 9'));
  await step('Ghi RPE cho set (lưu vào DB)', async () => {
    const sel = $$('.set:not(.head) select.rpe')[0]; sel.value = '7'; sel.dispatchEvent(new w.Event('input', { bubbles: true })); await wait(150);
    const { activeWorkout } = await w.eval("import('./js/db.js')"); // import trong iframe → đúng DB smoke
    return (await activeWorkout())?.entries[0].sets[0].rpe === 7;
  });
  await step('Luật gợi ý theo RPE', async () => {
    const { target } = await import('./js/overload.js');
    const S = (rpe) => [{ w: 60, r: 8, done: true, rpe }];
    const got = [target(S()), target(S(6)), target(S(7)), target(S(8)), target(S(9)), target(S(10))].map((t) => t.match(/[\d.,]+kg × \d+/g).join('|')).join(';');
    const want = '60kg × 9|62,5kg × 8;65kg × 8;62,5kg × 8;60kg × 9|62,5kg × 8;60kg × 9;60kg × 8';
    if (got !== want) lines.push(`  ${got} ≠ ${want}`);
    return got === want;
  });
  await step('Phát hiện PR', async () => { fillSets([60, 75]); await check(0); await check(1); return $$('.set:not(.head) .check')[1].textContent.includes('PR'); });
  await step('Ăn mừng: hàng set PR có .celebrate[data-celebrate=gold]', () => !!$('.set.celebrate[data-celebrate=gold]'));
  await step('Toast cổ vũ khi vượt', () => $$('.toast').some((t) => t.textContent.includes('PR mới')));
  await step('Kết thúc buổi 2', async () => { $('[data-act=finish]').click(); return !!(await until(() => w.location.hash.startsWith('#/ky/'))); });
  await step('Tổng kết: huy chương vàng + 1/1 bài vượt', async () => !!(await until(() => $('.tier[data-tier=gold]'))) && $('.overload')?.textContent.includes('1/1'));
  await step('Âm: phẩm mới phamKim (không kèm setXong), Xuất quan khi lưu buổi, Điều tức hết giờ hetGio', async () => {
    const S = await w.eval(`import('./js/sfx.js')`), p = S.played.join(',');
    const pham = /phamKim,xuatQuan$/.test(p.replace(/,(dotPha|loiKiep|thoiThe|xacChung|nhiemVu)/g, ''));
    const T = await w.eval(`import('./js/timer.js')`); T.start(1); await wait(1600);
    const end = S.played.at(-1) === 'hetGio';
    if (!pham || !end) lines.push(`  ${S.played.join(',')}`);
    return pham && end && S.played.filter((n) => n === 'xuatQuan').length === 2;
  });
  await step('Bế quan chưa có buổi: giáo án thật + lặp lại buổi gần nhất; Động phủ hết thẻ lần đầu', async () => {
    await go('#/'); await until(() => $('[data-schedule-today]'));
    const noFirst = !$('[data-first-run]');
    await go('#/workout');
    const tpl = await until(() => $$('.workout-start .start-templates button[data-id]').find((b) => b.getAttribute('aria-label').includes('Smoke A')));
    const again = $('.workout-start [data-act=again]');
    if (!tpl || !again) throw new Error(`thiếu giáo án ${!!tpl} / lặp lại ${!!again}`);
    again.click();
    const ok = await until(() => $$('section.entry').length === 1 && $$('.set:not(.head)').length >= 1);
    $('[data-act=discard]').click(); await until(() => w.location.hash !== '#/workout' || $('.workout-start'));
    return noFirst && !!ok;
  });
  await step('Luật so sánh quá tải', async () => {
    const { compare } = await import('./js/overload.js');
    const S = (...a) => a.map(([w, r]) => ({ w, r, done: true }));
    const t = (c, p, rec = 999) => compare(S(...c), S(...p), rec)?.tier ?? null;
    const cases = [
      [t([[65, 6]], [[60, 8]]), 'silver'], [t([[65, 3]], [[60, 8]]), null], [t([[60, 9]], [[60, 8]]), 'silver'],
      [t([[60, 8], [60, 8]], [[60, 8]]), 'bronze'], [t([[60, 8]], [[60, 8]]), null], [t([[60, 9]], [[60, 8]], 70), 'gold'],
      [t([[62.5, 8]], [[60, 8]], 76), 'silver'], [t([[65, 8]], [[60, 8]], 76), 'gold'],
    ];
    const bad = cases.map(([a, b], i) => (a === b ? '' : `#${i}:${a}≠${b}`)).filter(Boolean);
    if (bad.length) lines.push('  ' + bad.join(' '));
    return !bad.length;
  });
  for (const r of ['#/', '#/cong-phap', '#/ky', '#/ky/tuan', '#/ky/cong-duc', '#/tang-thu', '#/tang-thu/that-mach', '#/tang-thu/cai-dat']) {
    await step(`Render ${r}`, async () => { await go(r); return w.location.hash === r && !$('.error') && $('#main').innerText.trim().length > 20; });
  }
  await step('Route cũ chuyển sang route mới (5 mục Luyện Thể Ký)', async () => {
    const wid = (await (await w.eval("import('./js/db.js')")).all('workouts')).find((x) => x.end)?.id;
    const pairs = [['#/hero', '#/tang-thu/that-mach', '.cultivation-meridian'], ['#/history', '#/ky', 'a.card[href^="#/ky/"]'], [`#/history/${wid}`, `#/ky/${wid}`, 'section[data-muscle]'],
      ['#/report', '#/ky/tuan', '.report-stats'], ['#/report/-1', '#/ky/tuan/-1', '.report-stats, .empty, h1'], ['#/progress', '#/tang-thu', '.tabs'],
      ['#/progress/overview', '#/tang-thu/overview', '.year-grid'], ['#/progress/medal', '#/ky/cong-duc', '.medals'],
      ['#/templates', '#/cong-phap', '[href="#/cong-phap/new"]'], ['#/templates/new', '#/cong-phap/new', 'input'], ['#/settings', '#/tang-thu/cai-dat', '[data-k=gloss]']];
    const bad = [];
    for (const [from, to, sel] of pairs) {
      await go(from);
      if (!(await until(() => w.location.hash === to && $(sel))) || $('.error')) bad.push(`${from}→${w.location.hash}`);
    }
    await go('#/ky/tuan'); await go('#/settings'); await until(() => w.location.hash === '#/tang-thu/cai-dat');
    w.history.back(); await wait(300); if (w.location.hash !== '#/ky/tuan') bad.push(`Back sau chuyển hướng → ${w.location.hash}`); // replace, không thêm mục lịch sử
    await go('#/ky/tuan'); if (!$('nav a.on')) bad.push('nav không tô mục đang mở');
    if (bad.length) lines.push('  ' + bad.join(' '));
    return !bad.length;
  });
  await step('lore.js: 5 mục NAV, phẩm thay huy chương, term/hint/gloss, từ điển đủ chú', async () => {
    const L = await import('./js/lore.js'), { TIER_LABEL } = await import('./js/overload.js');
    const got = [L.NAV.map((n) => n.route).join(' '), TIER_LABEL.gold, TIER_LABEL.bronze, L.term('streak', 4), L.term('weeks', 6), L.term('rest'),
      L.term('ledger'), !!L.gloss('milestone'), L.gloss('x'), L.NAV.map((n) => n.hint).join('/'), L.hint('start'), L.hint('x'),
      L.GLOSSARY.length >= 30 && L.GLOSSARY.every((g) => g.term && g.hint && g.gloss), new Set(L.GLOSSARY.map((g) => g.term)).size === L.GLOSSARY.length].join(',');
    const want = ['#/ #/workout #/cong-phap #/ky #/tang-thu', 'Thượng phẩm', 'Hạ phẩm', 'Liên kích ×4', 'Đạo tâm 6 tuần', 'Điều tức', 'Công đức bạ', true, '', 'Hôm nay/Tập/Kế hoạch/Nhật ký/Tiến độ', 'Bắt đầu tập', '', true, true].join(',');
    if (got !== want) lines.push(`  ${got} ≠ ${want}`);
    return got === want;
  });
  await step('Tàng thư › Tổng quan: thẻ Sức mạnh có ~1RM + sparkline', async () => {
    await go('#/tang-thu/overview'); const c = await until(() => $('.lift-card[data-muscle=chest]'));
    return !!c && Number(c.querySelector('b').dataset.count) > 70 && !!c.querySelector('svg.spark path') && c.getAttribute('href').startsWith('#/tang-thu/ex/');
  });
  await step('Tổng quan: lưới năm tô ngày tập + cột khối lượng', async () => {
    await go('#/progress/overview');
    return !!(await until(() => $('.year-grid rect[data-muscle=chest]'))) && $('.year-total b')?.dataset.count === '1'
      && !!$('.chart.bars rect[data-muscle=chest]') && !!$('.legend-chip[data-muscle=chest]');
  });
  await step('Biểu đồ tiến độ có dữ liệu + nhãn điểm + đổi khoảng', async () => {
    await go('#/progress/ex'); if (!(await until(() => $('svg.chart path.line')))) return false;
    $('[data-range="0"]').click(); await wait(200);
    return $('[data-range="0"]').classList.contains('on') && !!$('svg.chart .pt') && !!$('.max-box b');
  });
  await step('Hàng bài tập có data-muscle', async () => { await go('#/history'); (await until(() => $('a.card[href^="#/ky/"]'))).click(); return !!(await until(() => $('section[data-muscle=chest]'))); });
  await step('Luật tổng quan: lưới năm, top lift, khối lượng tuần', async () => {
    const { yearGrid, topLifts, weeklyVolume } = await import('./js/insights.js');
    const D = 864e5, t0 = new Date(2026, 0, 5, 18).getTime(); // thứ Hai
    const ex = { b: { muscle: 'Ngực' }, s: { muscle: 'Chân' } };
    const S = (w, r, n = 1) => Array.from({ length: n }, () => ({ w, r, done: true }));
    const W = (id, day, ents) => ({ id, start: t0 + day * D, end: t0 + day * D + 1, entries: ents.map(([exerciseId, sets]) => ({ exerciseId, sets })) });
    const ws = [W('1', 0, [['b', S(60, 1)], ['s', S(100, 1, 3)]]), W('2', 2, [['b', S(70, 1)]]), W('3', 40, [['b', S(65, 1)], ['s', S(110, 1, 2)]])];
    const g = yearGrid(ws, ex, 2026, t0 + 41 * D), t = topLifts(ws, 3, t0 + 41 * D), v = weeklyVolume(ws, ex, 8, t0 + 41 * D);
    const got = [g.total, g.months[0][4].muscle, g.counts['Chân'], g.counts['Ngực'], t.lifts.map((l) => l.exerciseId).join(''), t.lifts[0].max, t.lifts[1].delta, t.total.max, t.total.delta,
      v.length, v[0].byMuscle['Ngực'] || 0, v.at(-1).total, new Date(v.at(-1).t).getDay()].join(',');
    const want = [3, 'Chân', 2, 3, 'bs', 70, 10, 180, 10, 8, 0, 285, 1].join(',');
    if (got !== want) lines.push(`  ${got} ≠ ${want}`);
    return got === want;
  });
  await step('Động phủ giữ mục tiêu tuần và Liên kích; Khí huyết chỉ ở Thất mạch', async () => {
    await go('#/'); const wk = await until(() => $('[data-session-goal=week]'));
    // Đọc data-count, không đọc chữ: số đang chạy hiệu ứng đếm từ 0.
    const got = [!$('[data-readiness-score]'), !!wk?.querySelector('[data-session-goal-count]')?.textContent.includes(' / '), $('[data-session-count]')?.dataset.count,
      $('.sanctum-stats .streak-multiplier [data-count]')?.dataset.count, !$('.lift-card, .cultivation-meridian, .cultivation-challenge')].join(',');
    if (got !== 'true,true,2,1,true') lines.push(`  ${got}`);
    await go('#/tang-thu/that-mach'); const score = await until(() => $('[data-readiness-score]'));
    return got === 'true,true,2,1,true' && !!score && /^\d+$/.test(score.textContent) && Number(score.textContent) <= 100
      && !!$('[data-readiness-chart] svg.spark');
  });
  await step('Tổng quan: thẻ Tổng ~1RM SBD dùng dữ liệu thật', async () => {
    await go('#/progress/overview'); const v = await until(() => $('[data-strength-total-value]'));

    await go('#/history'); return ok;
  });
  await step('Lịch tập: đặt ở Công pháp → Hôm nay nhắc, bỏ → mời đặt lịch', async () => {
    await go('#/'); if (!(await until(() => $('[data-schedule-today][data-state=none] a[href="#/cong-phap"]')))) return false;
    const dow = String(new Date().getDay());
    await go('#/cong-phap'); const row = await until(() => $(`[data-schedule] [data-day="${dow}"]`));
    const sel = row.querySelector('[data-f=tpl]'), tpl = [...sel.options].find((o) => o.textContent === 'Smoke A');
    if (!tpl) return false;
    sel.value = tpl.value; sel.dispatchEvent(new w.Event('change', { bubbles: true })); await wait(100);
    const saved = JSON.parse(w.localStorage.getItem('gym.settings')).schedule[dow] === tpl.value && row.querySelector('[data-f=on]').checked;
    await go('#/'); const card = await until(() => $('[data-schedule-today][data-state=done]')); // smoke đã tập hôm nay
    const ok = saved && !!card?.textContent.includes('Đã tập hôm nay') && !!card.querySelector('[data-act=empty]');
    await go('#/cong-phap'); const on = (await until(() => $(`[data-schedule] [data-day="${dow}"] [data-f=on]`)));
    on.checked = false; on.dispatchEvent(new w.Event('change', { bubbles: true })); await wait(100);
    await go('#/'); return ok && !!(await until(() => $('[data-schedule-today][data-state=none]'))) && !$('.schedule-preview');
  });

  await step('Báo cáo tuần: 2 buổi, 1 vượt, có nút chia sẻ', async () => {
    await go('#/report');
    const b = await until(() => $('.report-stats b'));
    return b?.dataset.count === '2' && $('.report-summary')?.textContent.includes('1/1') && !!$('.report-ex[data-tier=gold]') && !!$('[data-act=share]');
  });
  await step('Luật báo cáo tuần', async () => {
    const { weekReport, weekStart, reportText } = await import('./js/report.js');
    const t0 = new Date(2026, 0, 5, 18).getTime(), D = 864e5; // thứ Hai
    const W = (id, day, w, r, rpe) => ({ id, name: 'B' + id, start: t0 + day * D, end: t0 + day * D + 36e5, entries: [{ exerciseId: 'b', sets: [{ w, r, done: true, rpe }] }] });
    const ws = [W('1', -5, 50, 8), W('2', 0, 55, 8, 8), W('3', 3, 60, 8, 9), W('4', 7, 70, 8), { ...W('5', 1, 99, 9), end: null }];
    const r = weekReport(ws, [{ date: t0 - 6 * D, weight: 70 }, { date: t0 + 2 * D, weight: 69.5 }], { b: { name: 'Bench' } }, weekStart(t0 + 4 * D));
    const got = [r.cur.sessions, r.cur.sets, r.cur.vol, r.prev.sessions, r.beats, r.compared, r.rpe, r.weight.kg, r.weight.delta, r.days.map((d) => d.day).join(''), r.exercises[0].top.w].join(',');
    const want = [2, 2, 920, 1, 2, 2, 8.5, 69.5, -0.5, 'T2T5', 60].join(',');
    if (got !== want) lines.push(`  ${got} ≠ ${want}`);
    return got === want && reportText(r).includes('Bench: 2 set') && reportText(r).includes('Thượng phẩm') && !/🥇|🥈|🥉/.test(reportText(r));
  });
  // Import trong iframe → cùng module với app, DB_NAME = gym-smoke.
  const mod = (p) => w.eval(`import('./js/${p}')`);
  await step('Hôm nay nhắc sao lưu khi chưa sao lưu (chỉ khi đã ≥3 buổi)', async () => {
    const db = await mod('db.js'), n = (await db.all('workouts')).filter((x) => x.end).length;
    const pad = Array.from({ length: Math.max(0, 3 - n) }, (_, i) => ({ id: 'bk' + i, name: 'pad', start: 1e12 + i, end: 1e12 + i + 1, note: '', entries: [] }));
    for (const x of pad) await db.put('workouts', x);
    await go('#/ky'); await go('#/'); const ok = !!(await until(() => $('.backup-reminder')));
    for (const x of pad) await db.del('workouts', x.id);
    return ok;
  });
  await step('Luật nhắc sao lưu', async () => {
    const { backupDue } = await mod('safety.js'), D = 864e5, now = 100 * D, W = (end) => ({ end });
    const old = [W(now - 20 * D), W(now - 19 * D)]; // + 1 buổi = đủ 3 buổi mới nhắc
    return backupDue(0, [...old, W(now - D)], now) && !backupDue(0, [W(now - D)], now) && !backupDue(0, [...old, { end: null }], now)
      && !backupDue(now - 3 * D, [...old, W(now - D)], now) && backupDue(now - 8 * D, [...old, W(now - D)], now) && !backupDue(now - 8 * D, [W(now - 20 * D), W(now - 10 * D), W(now - 9 * D)], now);
  });
  await step('Khôi phục: từ chối file hỏng, ghi nguyên khối, hoàn tác được', async () => {
    const db = await mod('db.js'), sf = await mod('safety.js');
    const bad = [null, { app: 'x' }, { app: 'gym', workouts: 'x' }, { app: 'gym', workouts: [{ id: 'a' }] }, { app: 'gym', templates: [{}] }, { app: 'gym' }, { app: 'gym', version: 99, body: [] }];
    if (bad.some((d) => { try { db.validateBackup(d); return true; } catch { return false; } })) throw new Error('file hỏng lọt qua');
    const before = (await db.all('workouts')).length;
    if (!(await sf.snapshot())) throw new Error('không lưu được bản dự phòng');
    await db.importAll({ app: 'gym', workouts: [], body: [{ id: 'b1', date: 1, weight: 70 }] });
    const mid = (await db.all('workouts')).length, ex = (await db.all('exercises')).length;
    await sf.undoRestore();
    const after = (await db.all('workouts')).length;
    if (before !== 2 || mid !== 0 || !ex || after !== 2) lines.push(`  ${before},${mid},${ex},${after}`);
    return before === 2 && mid === 0 && ex > 0 && after === 2 && !sf.snapshotInfo();
  });
  await step('Nhật ký lỗi hiện ở Cài đặt, xoá được', async () => {
    const sf = await mod('safety.js');
    sf.logError(new Error('smoke-lỗi-thử'));
    await go('#/settings');
    const ok = !!(await until(() => $('.error-log')?.textContent.includes('smoke-lỗi-thử')));
    $('[data-act=clearErrors]').click(); await wait(200);
    return ok && !$('.error-log') && !sf.errorLog().length;
  });
  await step('Động phủ (O3): không còn form, dòng dẫn → Thân trọng rồi Cài đặt, lưu xong tính lại', async () => {
    await go('#/');
    const card = await until(() => $('.sanctum-cultivation'));
    if (!card || $('[data-hero-link]') || card.textContent.includes('Số liệu mẫu')) throw new Error('Động phủ chưa gộp hoặc chưa dùng số thật');
    const hintW = await until(() => $('[data-profile-hint=weight][href="#/tang-thu/body"]'));
    if (!hintW || $('[data-hero-profile]') || $('.cultivation-sample')) throw new Error('Động phủ còn form hoặc thiếu dòng dẫn cân nặng');
    hintW.click();
    const bf = await until(() => $('[data-form=body]'));
    input(bf.querySelector('[name=weight]'), '70'); bf.querySelector('button').click(); await wait(200);
    await go('#/tang-thu/that-mach');
    const hintS = await until(() => $('[data-profile-hint=sex][href="#/tang-thu/cai-dat"]'));
    if (!hintS || $('[data-hero-profile]')) throw new Error('Thất mạch còn form hoặc thiếu dòng dẫn giới tính');
    hintS.click();
    const sel = await until(() => $('select[data-k=sex]'));
    sel.value = 'm'; sel.dispatchEvent(new w.Event('change', { bubbles: true })); await wait(100);
    await go('#/');
    const strip = await until(() => !$('[data-profile-hint]') && $('.tuvi-strip[href="#/tang-thu/that-mach"]'));
    const body = await (await mod('db.js')).all('body');
    if (strip) strip.click();
    const lift = await until(() => $('.cultivation-meridian[data-muscle=chest] .cultivation-lift'));
    const ok = !!lift?.textContent.includes('×BW') && !!$('[data-tab=that-mach][aria-current=page]') && !$('[data-profile-hint]')
      && body.length === 1 && body[0].weight === 70 && JSON.parse(w.localStorage.getItem('gym.settings')).sex === 'm';
    if (!ok) lines.push(`  ${lift?.textContent} | body ${body.length}`);
    await go('#/'); return ok && !!(await until(() => $('.tuvi-strip')));
  });
  await step('Động phủ đợt 2: nhiệm vụ thật, Đột phá mở + đóng, lưu mốc', async () => {
    const card = await until(() => $('.sanctum-cultivation [data-quests]'));
    if (!card || card.textContent.includes('mẫu')) throw new Error('Động phủ chưa có nhiệm vụ thật');
    const zero = Object.fromEntries(['tuvi', 'chest', 'back', 'shoulders', 'legs', 'biceps', 'triceps', 'core'].map((k) => [k, [0, 0]]));
    w.localStorage.setItem(`gym.heroSeen.${DB}`, JSON.stringify(zero));
    await go('#/ky'); await go('#/'); // Động phủ (bản gọn) vẫn phải bật Đột phá + hiện Nhiệm vụ tuần
    const dlg = await until(() => $('dialog.breakthrough-modal[open]'));
    const quests = $$('[data-quests] [data-quest]').length, sample = !!$('.cultivation-demo, .cultivation-data-badge');
    if (!dlg || quests !== 2 || sample) throw new Error(`modal ${!!dlg}, ${quests} nhiệm vụ, mẫu ${sample}`);
    dlg.querySelector('[data-act=closeBreak]').click();
    const gone = await until(() => !$('dialog.breakthrough-modal[open]'), 5000);
    const seen = JSON.parse(w.localStorage.getItem(`gym.heroSeen.${DB}`));
    await go('#/');
    return !!gone && seen.chest[0] + seen.chest[1] > 0;
  });
  await step('Nhập môn: khai báo, bỏ Deadlift, Trắc linh căn, lưu kế hoạch → giáo án + lịch + mốc', async () => {
    const S = () => JSON.parse(w.localStorage.getItem('gym.settings'));
    const at = async (n) => !!(await until(() => $(`[data-dao-step="${n}"]`)));
    const next = async (n) => { $('[data-act=daoNext]').click(); return at(n); };
    await go('#/nhap-mon/1'); await at(1);
    input($('[name=name]'), 'Thanh Vân'); if (!(await next(2))) throw new Error('bước 2');
    if (!$('[data-dao-known]') || $('select[name=sex]')) throw new Error('Nhập môn hỏi lại giới tính/cân nặng đã có (O3)');
    input($('[name=height]'), '174'); // giới tính + cân nặng đã có từ Cài đặt/Thân trọng
    if (!(await next(3))) throw new Error('bước 3');
    $('[name=experience][value=mid]').click(); $('[name=goal][value=strength]').click(); $('[name=days][value="4"]').click();
    if (!(await next(4))) throw new Error('bước 4');
    const box = (id) => $(`input[data-path=back][value="${id}"]`);
    box('x-deadlift').click(); // bỏ Deadlift → Lưng thiếu 1 bài → không đi tiếp được
    const blocked = await until(() => $('[data-act=daoNext]')?.disabled && $('[data-muscle=back] .dao-path-warning'));
    box('x-pull-up').click();
    const freed = await until(() => !$('[data-act=daoNext]').disabled);
    if (!blocked || !freed || !(await next(5))) throw new Error(`Công pháp: chặn ${!!blocked}, mở ${!!freed}`);
    const fill = (id, kg, r) => { const f = $(`[data-test="${id}"]`); input(f.querySelector('[name=w]'), kg); input(f.querySelector('[name=r]'), r); };
    fill('x-squat', 140, 5); fill('x-front-squat', 110, 3); fill('x-bench-press-on', 100, 5); fill('x-pull-up', 20, 5);
    if (!(await next(6))) throw new Error('bước 6');
    const rank = $('.dao-rank strong')?.textContent, days = $$('.dao-schedule li').length;
    $$('dialog[open]').forEach((d) => d.close()); $('[data-act=daoSave]').click(); // đóng màn Thối thể còn chờ từ bước trước
    const done = await until(() => w.location.hash === '#/' && $('.tuvi-strip'), 5000);
    const ceremonyShown = !!$('dialog.breakthrough-modal[open]');
    if (done) done.click();
    await until(() => $('.cultivation-meridian'));
    const s = S(), tpl = (await (await mod('db.js')).all('templates')).filter((t) => t.name.startsWith('Giáo án'));
    const seen = JSON.parse(w.localStorage.getItem(`gym.heroSeen.${DB}`));
    const got = [!!done, !!rank, days, s.dao.name, s.dao.path.back.join('+'), s.dao.tested.length, tpl.length, Object.keys(s.schedule).join(''), s.weekGoal,
      s.dao.templateIds.length, !!seen, ceremonyShown, $('.cultivation-navigation')?.textContent.includes('Sửa bài theo mạch'),
      !!$('.cultivation-meridian[data-muscle=legs] .cultivation-tested')].join(',');
    // Làm lại Nhập môn: ghi đè giáo án cũ, không nhân đôi.
    await go('#/nhap-mon/6'); await at(6); $('[data-act=daoSave]').click(); await until(() => w.location.hash === '#/' && $('.tuvi-strip'), 5000);
    const tpl2 = (await (await mod('db.js')).all('templates')).filter((t) => t.name.startsWith('Giáo án')).length;
    const want = ['true', 'true', 4, 'Thanh Vân', 'x-barbell-row+x-pull-up', 4, 4, '1245', 4, 4, 'true', 'false', 'true', 'true'].join(',');
    if (got !== want || tpl2 !== 4) lines.push(`  ${got} | lại ${tpl2}\n  ≠ ${want}`);
    return got === want && tpl2 === 4;
  });
  await step('Khoá Công pháp: picker chỉ còn bài đã chọn, giáo án có Deadlift bị bỏ bài', async () => {
    const S = JSON.parse(w.localStorage.getItem('gym.settings')), path = Object.values(S.dao.path).flat();
    const { startWorkout } = await mod('views/workout.js'), db = await mod('db.js');
    await startWorkout({ template: { id: 't-lock', name: 'Khoá', items: [{ exerciseId: 'x-deadlift', sets: 3, reps: 5, rest: 120 }, { exerciseId: 'x-squat', sets: 3, reps: 5, rest: 120 }] } });
    const cur = await db.activeWorkout();
    await until(() => $('[data-act=addEx]'));
    $('[data-act=addEx]').click();
    const modal = await until(() => $('.modal[data-locked=path] .pick-list .item'));
    const items = $$('.modal .pick-list .item').map((b) => b.dataset.id);
    const chips = $$('.modal .chip').map((c) => c.textContent).join('|');
    const got = [!!modal, items.length === path.length && items.every((id) => path.includes(id)), !items.includes('x-deadlift'), !$('.modal [data-new]'),
      chips.startsWith('Tất cả|Ngực|Lưng'), cur.entries.map((e) => e.exerciseId).join('+')].join(',');
    $('.modal [data-close]').click();
    $('[data-act=discard]')?.click(); await until(() => w.location.hash !== '#/workout');
    const want = ['true', 'true', 'true', 'true', 'true', 'x-squat'].join(',');
    if (got !== want) lines.push(`  ${got}\n  ≠ ${want}`);
    return got === want;
  });
  await step('Luật recap(): Linh khí buổi, mạch khai/lên, nhiệm vụ vừa xong, Buổi sau theo lịch → giáo án → mạch', async () => {
    const R = await mod('recap.js'), D = 864e5, t0 = new Date(2026, 0, 5, 18).getTime(); // T2
    const exercises = [{ id: 'b', name: 'Bench Press', muscle: 'Ngực' }, { id: 'i', name: 'Incline Bench Press', muscle: 'Ngực' }, { id: 's', name: 'Squat', muscle: 'Chân' }];
    const mk = (id, t, es) => ({ id, name: id, start: t, end: t + 36e5, entries: es.map(([e, kg]) => ({ exerciseId: e, sets: [{ w: kg, r: 5, done: true }, { w: kg, r: 5, done: true }] })) });
    const w1 = mk('w1', t0, [['b', 60]]), w2 = mk('w2', t0 + 2 * D, [['b', 80], ['i', 70]]);
    const ctx = { workouts: [w1, w2], exercises, body: [{ id: 'x', date: t0 + 5 * D, weight: 75 }], settings: { sex: 'm' } };
    const r = R.recap(w2, ctx), ch = r.meridians.find((m) => m.key === 'chest');
    const noW = R.recap(w2, { ...ctx, body: [] });
    const sch = R.recap(w2, { ...ctx, templates: [{ id: 'T', name: 'Đẩy', items: [1, 2] }], settings: { sex: 'm', schedule: { 5: 'T' } } }).next;
    const tpl = R.recap(w2, { ...ctx, templates: [{ id: 'T', name: 'Đẩy', items: [1, 2] }] }).next;
    const got = [r.linhKhi.gain, r.pham, `${ch?.opened}/${R.recap(w1, ctx).meridians[0].opened}`, r.tuvi.opened, r.meridians.length, r.next.kind, r.next.title, noW.needsWeight, noW.meridians[0].to,
      R.recap(w1, ctx).quests.length >= 0, sch.kind + sch.when + sch.title, tpl.kind + tpl.title].join(',');
    const want = ['170', 'gold', 'false/true', '1', '1', 'meridian', 'Mạch Lưng', 'true', '', 'true', 'scheduleThứ 6Đẩy', 'templateĐẩy'].join(',');
    if (got !== want) lines.push(`  ${got}\n  ≠ ${want}`);
    return got === want;
  });
  await step('Không tràn ngang ở 375px',() => w.document.documentElement.scrollWidth <= 376);
  await step('Không có lỗi JS', () => (errors.length ? (lines.push('  ' + errors.join('\n  ')), false) : true));
} finally {
  w.localStorage.removeItem('gym.restEnd'); w.localStorage.removeItem('gym.restStart'); localStorage.removeItem('gym.restStart');
  for (const k of ['gym.lastBackup', 'gym.preRestore', 'gym.errors', 'gym.heroSeen', 'gym.questSeen']) w.localStorage.removeItem(`${k}.${DB}`);
  if (seenBak === null) w.localStorage.removeItem('gym.medalSeen'); else w.localStorage.setItem('gym.medalSeen', seenBak);
  if (setBak === null) w.localStorage.removeItem('gym.settings'); else w.localStorage.setItem('gym.settings', setBak);
  frame.src = 'about:blank'; await wait(100);
  indexedDB.deleteDatabase(DB);
  log(true, '(đã xoá DB smoke)');
  lines.push(`SMOKE: ${fail ? `FAIL (${fail})` : 'PASS'}`); out.textContent = lines.join('\n');
}
</script>
